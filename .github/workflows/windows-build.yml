name: Windows build

# PyInstaller cannot cross-compile, so the Windows executable has to be built on
# Windows. This runner is that Windows machine.
#
# What it can and cannot prove is worth stating plainly. It builds, starts the
# shell with no Model Package, and runs real inference against a synthetic
# package assembled here. That last check is the one that matters for a bundle:
# CatBoost and LightGBM arrive as native libraries no static import names, so a
# broken build starts normally and fails only when someone asks it to predict.
#
# It cannot click anything. Every interface defect this project has found was
# found by a person using the application, so a green run means the build is
# sound, not that the interface is. A Windows release still needs someone to
# open it and use it before it is trusted.
#
# It produces two things: a portable zip, and a per-user installer that needs no
# administrator and registers the application the way Windows expects. It runs
# when a release is published, so both attach to a release that already exists,
# and on demand for testing a build without publishing one.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the project and the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      # The identity assets, including the .ico this executable is stamped with,
      # are committed and are the shipped ones. They are not regenerated here:
      # the locked reference is the authority, and rebuilding them on a runner
      # would risk a rendering difference deciding what the application looks
      # like. Regenerate deliberately with scripts/extract_identity_assets.py.

      - name: Build
        run: >
          pyinstaller packaging/resolved-layers.spec
          --distpath dist --workpath build/pyinstaller --noconfirm --log-level WARN

      - name: Report the version the build claims
        run: dist/resolved-layers/resolved-layers.exe --version

      - name: Start the shell without a Model Package
        # A distributed build ships none. Everything except prediction must
        # still work, and the run action must say so rather than blaming the
        # source dataset.
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/resolved-layers/resolved-layers.exe --smoke

      - name: Prove the build can actually predict
        # No real Model Package may be committed, so one is assembled here from
        # two tiny boosters trained on random data. It predicts nothing
        # meaningful; it proves the bundle can unpickle boosters and run them.
        shell: pwsh
        run: |
          python scripts/make_smoke_package.py --output build/smoke
          dist/resolved-layers/resolved-layers.exe --verify-inference `
            --model-package build/smoke/package/manifest.json `
            --open build/smoke/source.csv

      - name: Package it
        id: package
        shell: pwsh
        run: |
          $version = python -c "import variant_inference; print(variant_inference.__version__)"
          $name = "Resolved_Layers-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item -Recurse dist/resolved-layers "staging/$name"
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md "staging/$name/"
          Copy-Item packaging/WINDOWS.md "staging/$name/README.txt"
          Compress-Archive -Path "staging/$name" -DestinationPath "$name.zip"
          "archive=$name.zip" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        id: installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          $version = python -c "import variant_inference; print(variant_inference.__version__)"
          & $iscc /Qp `
            "/DAppVersion=$version" `
            "/DSourceDir=$PWD\dist\resolved-layers" `
            "/O$PWD" `
            packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }
          $setup = "Resolved_Layers-$version-windows-x86_64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "installer was not produced" }
          "{0:N0} bytes" -f (Get-Item $setup).Length
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.installer.outputs.setup }}
          retention-days: 30

      - name: Attach both to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload ${{ github.event.release.tag_name }}
          ${{ steps.package.outputs.archive }}
          ${{ steps.installer.outputs.setup }}
          --clobber
