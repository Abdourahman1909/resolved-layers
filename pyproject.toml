[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chl-resolved-layers"
# Single source of truth: src/variant_inference/__init__.py
dynamic = ["version"]
description = "Resolved Layers, Computational Health Lab's evidence-first desktop inference product"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "catboost==1.2.10",
  "lightgbm==4.7.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "PySide6>=6.7,<7",
  "scikit-learn==1.7.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<6",
]
# Regenerating shipped identity assets from the locked reference sheet.
assets = [
  "pillow>=10,<12",
]
# Building the standalone desktop package.
packaging = [
  "nuitka>=2.4",
]

[project.scripts]
resolved-layers = "variant_inference.main:main"
variant-inference = "variant_inference.main:main"

[tool.setuptools.dynamic]
version = {attr = "variant_inference.__version__"}

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
variant_inference = [
  "qml/*.qml",
  "assets/identity/*.png",
  "assets/icons/*.png",
  "assets/icons/*.ico",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
