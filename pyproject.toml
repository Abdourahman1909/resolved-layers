[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chl-variant-inference"
version = "0.1.0"
description = "Computational Health Lab's evidence-first desktop variant inference application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<6",
]

[project.scripts]
variant-inference = "variant_inference.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
variant_inference = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

